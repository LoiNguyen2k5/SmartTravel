server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: smart-travel-api
  
  datasource:
    url: jdbc:mysql://localhost:3306/smart_travel_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

  # Configuration for sending Emails via Gmail SMTP
  mail:
    host: smtp.gmail.com
    port: 587
    username: tiemnet.coaching.y3@gmail.com # Replace with your Gmail address
    password: owltnokkvlcwmmzi             # Gmail App Password (no spaces)
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# Application Custom Properties
app:
  jwt:
    # 256-bit HS256 secret key formatted in base64/hex (at least 32 chars)
    secret: 9a6e8b7c4d3e2f1a5b6c7d8e9f0a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a
    expiration-ms: 86400000 # 24 hours in milliseconds
    refresh-expiration-ms: 604800000 # 7 days in milliseconds

  otp:
    expiration-seconds: 60 # Mã OTP có hiệu lực trong 60 giây theo yêu cầu

  cors:
    allowed-origins: "http://localhost:5173,http://localhost:3000"
    allowed-methods: "GET,POST,PUT,DELETE,PATCH,OPTIONS"
    allowed-headers: "*"
    allow-credentials: true

# SpringDoc OpenAPI / Swagger UI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
